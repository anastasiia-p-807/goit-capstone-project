services:
  journal:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - journal-data:/app/data
    environment:
      STILL_ALLOWED_HOSTS: "127.0.0.1,localhost"
      STILL_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000"
      STILL_ALLOW_REGISTRATION: "1"
      STILL_SECURE_COOKIES: "0"
    restart: unless-stopped
volumes:
  journal-data:
